<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
  <defs>
    <!-- Efekt neonowego świecenia (Glow) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Tło -->
  <rect width="500" height="400" fill="#0d1117" rx="10"/>

  <!-- Neonowa fioletowa mgiełka w centrum -->
  <circle cx="250" cy="200" r="40" fill="#b026ff" opacity="0.15" filter="blur(15px)" />

  <!-- Osie (linie krzyża) -->
  <line x1="250" y1="80" x2="250" y2="320" stroke="#b026ff" stroke-width="1.5" opacity="0.4" />
  <line x1="130" y1="200" x2="370" y2="200" stroke="#b026ff" stroke-width="1.5" opacity="0.4" />

  <!-- Teksty etykiet (Białe) i procenty (fiolet) -->
  <!-- GÓRA: Code review -->
  <text x="250" y="55" fill="#ffffff" font-size="14" font-family="Segoe UI, sans-serif" font-weight="bold" text-anchor="middle">Code review</text>
  <text x="250" y="72" fill="#b026ff" font-size="13" font-family="Segoe UI, sans-serif" text-anchor="middle" filter="url(#glow)">0%</text>

  <!-- PRAWO: Issues -->
  <text x="385" y="192" fill="#b026ff" font-size="15" font-family="Segoe UI, sans-serif" font-weight="bold" text-anchor="start" filter="url(#glow)">2%</text>
  <text x="385" y="210" fill="#ffffff" font-size="13" font-family="Segoe UI, sans-serif" text-anchor="start">Issues</text>

  <!-- DÓŁ: Pull Requests -->
  <text x="250" y="338" fill="#b026ff" font-size="14" font-family="Segoe UI, sans-serif" font-weight="bold" text-anchor="middle" filter="url(#glow)">1%</text>
  <text x="250" y="354" fill="#ffffff" font-size="13" font-family="Segoe UI, sans-serif" text-anchor="middle">Pull requests</text>

  <!-- LEWO: Commits -->
  <text x="115" y="192" fill="#b026ff" font-size="15" font-family="Segoe UI, sans-serif" font-weight="bold" text-anchor="end" filter="url(#glow)">97%</text>
  <text x="115" y="210" fill="#ffffff" font-size="13" font-family="Segoe UI, sans-serif" text-anchor="end">Commits</text>

  <!-- Główny wielokąt danych z neonową obwódką -->
  <polygon points="250,195 255,200 250,205 134,200" fill="#b026ff" fill-opacity="0.15" stroke="#b026ff" stroke-width="2" filter="url(#glow)" />
  
  <!-- Punkty danych (Małe kropki z glow) -->
  <circle cx="250" cy="195" r="3" fill="#ffffff" stroke="#b026ff" stroke-width="1.5" filter="url(#glow)" />
  <circle cx="255" cy="200" r="3" fill="#ffffff" stroke="#b026ff" stroke-width="1.5" filter="url(#glow)" />
  <circle cx="250" cy="205" r="3" fill="#ffffff" stroke="#b026ff" stroke-width="1.5" filter="url(#glow)" />
  <circle cx="134" cy="200" r="4" fill="#ffffff" stroke="#b026ff" stroke-width="2" filter="url(#glow)" />
</svg>