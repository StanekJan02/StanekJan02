name: Generate Neon Graph

on:
  schedule:
    - cron: "0 0 * * *"    
  workflow_dispatch:    
  push:
    branches:
      - main           

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Generate SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/neon-graph-dark.svg?palette=github-dark&color_dots=#161b22,#4a0f69,#7a18ad,#9f1fe6,#b026ff&color_snake=#b026ff
        env:
          GITHUB_TOKEN: ${{ secrets.SNAKE_TOKEN }}
          
      - name: Generate Contributions Count SVG
        env:
          GH_TOKEN: ${{ secrets.SNAKE_TOKEN }}
        run: |
          mkdir -p dist
          COUNT=$(gh api graphql -f query='query { user(login: "${{ github.repository_owner }}") { contributionsCollection { contributionCalendar { totalContributions } } } }' --jq '.data.user.contributionsCollection.contributionCalendar.totalContributions')
          echo '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="40">' > dist/contributions.svg
          echo '  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold" font-size="18" fill="#ffffff">' >> dist/contributions.svg
          echo '    Contributions this year: <tspan fill="#b026ff">'"${COUNT}"'</tspan>' >> dist/contributions.svg
          echo '  </text>' >> dist/contributions.svg
          echo '</svg>' >> dist/contributions.svg
      - name: Generate About Me SVG with Background Image
        run: |
          python3 -c "
          import base64
          import textwrap

          # Konfiguracja
          # PODMIEŃ 'background.jpg' na nazwę swojego zdjęcia w repozytorium!
          BACKGROUND_IMAGE_PATH = 'm8.jpg' 
          
          # Twój tekst (użyto mechanizmu textwrap dla ładnego dzielenia wierszy)
          TEXT_PARAGRAPH_1 = '''I'm currently in my final semester of Computer Science engineering studies at the Silesian University of Technology. I enjoy building robust backend architectures and desktop applications, and I am actively looking for an IT Internship or a Junior Software Engineer role to kickstart my career.'''
          TEXT_PARAGRAPH_2 = '''Beyond standard development, I love exploring data processing, machine learning, and low-level hardware integration. When I'm away from the keyboard, you'll probably find me pointing my telescope at the night sky, capturing astrophotography, and developing my own image-stacking software.'''

          # Przygotowanie obrazu jako Base64 (dla wbudowania w SVG)
          try:
              with open(BACKGROUND_IMAGE_PATH, 'rb') as img_file:
                  img_data = img_file.read()
                  b64_img = base64.b64encode(img_data).decode('utf-8')
                  img_ext = BACKGROUND_IMAGE_PATH.split('.')[-1].lower()
                  img_type = 'image/png' if img_ext == 'png' else 'image/jpeg'
                  img_b64_string = f'data:{img_type};base64,{b64_img}'
          except FileNotFoundError:
              # Fallback na ciemne tło jeśli zdjęcie nie zostanie znalezione
              print(f'Nie znaleziono pliku: {BACKGROUND_IMAGE_PATH}. Używam ciemnego tła.')
              img_b64_string = ''

          # Opcje ramki i tekstu
          width, height = 800, 300 # Dopasuj wymiary SVG
          padding = 40
          line_height = 24
          font_size = 15
          font_family = 'Segoe UI, Helvetica, Arial, sans-serif'
          text_color = '#ffffff'
          accent_color = '#4fa3f7' # Jasnoniebieski jak na screenie

          # Generowanie tła w SVG (zdjęcie lub szare pudełko)
          if img_b64_string:
              # Zastosowano opacity dla zdjęcia, aby tekst był bardziej czytelny i lekko przyciemniony nakładką
              background_svg = f'''
                  <image href=\"{img_b64_string}\" x=\"0\" y=\"0\" width=\"{width}\" height=\"{height}\" preserveAspectRatio=\"xMidYMid slice\" opacity=\"0.4\" />
                  <rect x=\"0\" y=\"0\" width=\"{width}\" height=\"{height}\" fill=\"#0d1117\" opacity=\"0.6\" rx=\"6\" /> 
              '''
          else:
             background_svg = f'<rect x=\"0\" y=\"0\" width=\"{width}\" height=\"{height}\" fill=\"#0d1117\" rx=\"6\" stroke=\"#30363d\" stroke-width=\"1\"/>'

          # Formatowanie tekstu na linie (żeby się nie ucinał z boku)
          lines_p1 = textwrap.wrap(TEXT_PARAGRAPH_1, width=95)
          lines_p2 = textwrap.wrap(TEXT_PARAGRAPH_2, width=95)

          # Składanie SVG
          svg = f'''<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"{width}\" height=\"{height}\" viewBox=\"0 0 {width} {height}\">
            <defs>
               <!-- Definiujemy styl dla pogrubień i kolorów -->
               <style>
                  .bold {{ font-weight: bold; }}
                  .accent {{ fill: {accent_color}; font-weight: bold; }}
               </style>
            </defs>

            {background_svg}

            <!-- Nagłówek -->
            <text x=\"{padding}\" y=\"{padding + 15}\" fill=\"{text_color}\" font-size=\"18\" font-family=\"{font_family}\" class=\"bold\">Hi, I'm Jan!</text>

            <!-- Paragraf 1 -->
            '''
          
          current_y = padding + 60
          for line in lines_p1:
              # Prosta podmiana dla efektów ze screena
              line = line.replace('IT Internship', f'</tspan><tspan class=\"accent\">IT Internship</tspan><tspan>')
              line = line.replace('Junior Software Engineer', f'</tspan><tspan class=\"accent\">Junior Software Engineer</tspan><tspan>')
              svg += f'<text x=\"{padding}\" y=\"{current_y}\" fill=\"{text_color}\" font-size=\"{font_size}\" font-family=\"{font_family}\"><tspan>{line}</tspan></text>'
              current_y += line_height

          current_y += 15 # Odstęp między paragrafami

          # Paragraf 2
          for line in lines_p2:
              svg += f'<text x=\"{padding}\" y=\"{current_y}\" fill=\"{text_color}\" font-size=\"{font_size}\" font-family=\"{font_family}\">{line}</text>'
              current_y += line_height

          svg += '''
          </svg>'''

          with open('dist/about-me.svg', 'w') as f:
              f.write(svg)
          "    
      - name: Generate Radar SVG
        env:
          GH_TOKEN: ${{ secrets.SNAKE_TOKEN }}
        run: |
          # 1. Pobranie realnych statystyk przez GitHub GraphQL API
          DATA=$(gh api graphql -f query='query { user(login: "${{ github.repository_owner }}") { contributionsCollection { totalCommitContributions totalIssueContributions totalPullRequestContributions totalPullRequestReviewContributions } } }')
          
          COMMITS=$(echo "$DATA" | jq '.data.user.contributionsCollection.totalCommitContributions')
          ISSUES=$(echo "$DATA" | jq '.data.user.contributionsCollection.totalIssueContributions')
          PRS=$(echo "$DATA" | jq '.data.user.contributionsCollection.totalPullRequestContributions')
          REVIEWS=$(echo "$DATA" | jq '.data.user.contributionsCollection.totalPullRequestReviewContributions')

          # 2. Wygenerowanie fioletowego radaru neonowego w Pythonie
          python3 -c "
          import math

          # Dane wejściowe z basha
          commits, issues, prs, reviews = $COMMITS, $ISSUES, $PRS, $REVIEWS
          total = commits + issues + prs + reviews
          if total == 0: total = 1 # zabezpieczenie

          # Obliczanie procentów
          p_commits = round((commits / total) * 100)
          p_issues = round((issues / total) * 100)
          p_prs = round((prs / total) * 100)
          p_reviews = round((reviews / total) * 100)

          # Centrowanie i wymiary (250x200 to środek)
          cx, cy = 250, 200
          max_r = 120 # maksymalna długość ramienia

          # Pozycja na osiach (od 0 do max_r na bazie %)
          # GÓRA (Reviews), PRAWO (Issues), DÓŁ (PRs), LEWO (Commits)
          r_rev = max(5, int((p_reviews / 100) * max_r))
          r_iss = max(5, int((p_issues / 100) * max_r))
          r_prs = max(5, int((p_prs / 100) * max_r))
          r_com = max(5, int((p_commits / 100) * max_r))

          # Punkty wielokąta statystyk
          y_rev = cy - r_rev
          x_iss = cx + r_iss
          y_prs = cy + r_prs
          x_com = cx - r_com

          # Generowanie kodu SVG
          svg = f'''<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"500\" height=\"400\" viewBox=\"0 0 500 400\">
            <defs>
              <!-- Efekt neonowego świecenia (Glow) -->
              <filter id=\"glow\" x=\"-20%\" y=\"-20%\" width=\"140%\" height=\"140%\">
                <feGaussianBlur stdDeviation=\"4\" result=\"blur\" />
                <feMerge>
                  <feMergeNode in=\"blur\" />
                  <feMergeNode in=\"SourceGraphic\" />
                </feMerge>
              </filter>
            </defs>

            <!-- Tło -->
            <rect width=\"500\" height=\"400\" fill=\"#0d1117\" rx=\"10\"/>

            <!-- Neonowa fioletowa mgiełka w centrum -->
            <circle cx=\"{cx}\" cy=\"{cy}\" r=\"40\" fill=\"#b026ff\" opacity=\"0.15\" filter=\"blur(15px)\" />

            <!-- Osie (linie krzyża) -->
            <line x1=\"{cx}\" y1=\"{cy - max_r}\" x2=\"{cx}\" y2=\"{cy + max_r}\" stroke=\"#b026ff\" stroke-width=\"1.5\" opacity=\"0.4\" />
            <line x1=\"{cx - max_r}\" y1=\"{cy}\" x2=\"{cx + max_r}\" y2=\"{cy}\" stroke=\"#b026ff\" stroke-width=\"1.5\" opacity=\"0.4\" />

            <!-- Teksty etykiet (Białe) i procenty (fiolet) -->
            <!-- GÓRA: Code review -->
            <text x=\"{cx}\" y=\"{cy - max_r - 25}\" fill=\"#ffffff\" font-size=\"14\" font-family=\"Segoe UI, sans-serif\" font-weight=\"bold\" text-anchor=\"middle\">Code review</text>
            <text x=\"{cx}\" y=\"{cy - max_r - 8}\" fill=\"#b026ff\" font-size=\"13\" font-family=\"Segoe UI, sans-serif\" text-anchor=\"middle\" filter=\"url(#glow)\">{p_reviews}%</text>

            <!-- PRAWO: Issues -->
            <text x=\"{cx + max_r + 15}\" y=\"{cy - 8}\" fill=\"#b026ff\" font-size=\"15\" font-family=\"Segoe UI, sans-serif\" font-weight=\"bold\" text-anchor=\"start\" filter=\"url(#glow)\">{p_issues}%</text>
            <text x=\"{cx + max_r + 15}\" y=\"{cy + 10}\" fill=\"#ffffff\" font-size=\"13\" font-family=\"Segoe UI, sans-serif\" text-anchor=\"start\">Issues</text>

            <!-- DÓŁ: Pull Requests -->
            <text x=\"{cx}\" y=\"{cy + max_r + 18}\" fill=\"#b026ff\" font-size=\"14\" font-family=\"Segoe UI, sans-serif\" font-weight=\"bold\" text-anchor=\"middle\" filter=\"url(#glow)\">{p_prs}%</text>
            <text x=\"{cx}\" y=\"{cy + max_r + 34}\" fill=\"#ffffff\" font-size=\"13\" font-family=\"Segoe UI, sans-serif\" text-anchor=\"middle\">Pull requests</text>

            <!-- LEWO: Commits -->
            <text x=\"{cx - max_r - 15}\" y=\"{cy - 8}\" fill=\"#b026ff\" font-size=\"15\" font-family=\"Segoe UI, sans-serif\" font-weight=\"bold\" text-anchor=\"end\" filter=\"url(#glow)\">{p_commits}%</text>
            <text x=\"{cx - max_r - 15}\" y=\"{cy + 10}\" fill=\"#ffffff\" font-size=\"13\" font-family=\"Segoe UI, sans-serif\" text-anchor=\"end\">Commits</text>

            <!-- Główny wielokąt danych z neonową obwódką -->
            <polygon points=\"{cx},{y_rev} {x_iss},{cy} {cx},{y_prs} {x_com},{cy}\" fill=\"#b026ff\" fill-opacity=\"0.15\" stroke=\"#b026ff\" stroke-width=\"2\" filter=\"url(#glow)\" />
            
            <!-- Punkty danych (Małe kropki z glow) -->
            <circle cx=\"{cx}\" cy=\"{y_rev}\" r=\"3\" fill=\"#ffffff\" stroke=\"#b026ff\" stroke-width=\"1.5\" filter=\"url(#glow)\" />
            <circle cx=\"{x_iss}\" cy=\"{cy}\" r=\"3\" fill=\"#ffffff\" stroke=\"#b026ff\" stroke-width=\"1.5\" filter=\"url(#glow)\" />
            <circle cx=\"{cx}\" cy=\"{y_prs}\" r=\"3\" fill=\"#ffffff\" stroke=\"#b026ff\" stroke-width=\"1.5\" filter=\"url(#glow)\" />
            <circle cx=\"{x_com}\" cy=\"{cy}\" r=\"4\" fill=\"#ffffff\" stroke=\"#b026ff\" stroke-width=\"2\" filter=\"url(#glow)\" />
          </svg>'''

          with open('dist/radar.svg', 'w') as f:
              f.write(svg)
          "
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
