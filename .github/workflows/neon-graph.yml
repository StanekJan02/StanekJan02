name: Generate Neon Graph

on:
  schedule:
    - cron: "0 0 * * *"    
  workflow_dispatch:    
  push:
    branches:
      - main           

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Generate SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/neon-graph-dark.svg?palette=github-dark&color_dots=#161b22,#4a0f69,#7a18ad,#9f1fe6,#b026ff&color_snake=#b026ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
